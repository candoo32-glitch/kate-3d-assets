name: Convert Kate Assets for Metal
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-for-metal.yml'
      - 'scripts/convert_for_metal.py'
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save @gltf-transform/cli
      - run: python -m pip install numpy trimesh
      - name: Download, decompress and convert assets
        run: python scripts/convert_for_metal.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kate-Converted-Metal-Assets
          path: dist/Kate-Converted-Metal-Assets.zip
          if-no-files-found: error
