name: Build Kate 3D Model Library
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_model_library.py'
      - '.github/workflows/model-library.yml'
  workflow_dispatch:
    inputs:
      model_limit:
        description: 'Maximum CC0 GLB models to bundle'
        required: false
        default: '3'
  schedule:
    - cron: '0 5 1 * *'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender for authored-model conversion
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Download and validate CC0 GLB models
        run: python -u scripts/build_model_library.py --limit ${{ github.event.inputs.model_limit || '3' }} --max-attempts 6 --output dist
      - name: Validate catalog and GLB headers
        run: |
          python - <<'PY'
          import json, pathlib
          d=pathlib.Path('dist')
          m=json.loads((d/'catalog.json').read_text())['models']
          assert len(m)>0
          for item in m:
              f=d/item['file']
              assert f.is_file() and f.read_bytes()[:4]==b'glTF'
          print(f'Validated {len(m)} GLB assets')
          PY
      - name: Package model collection
        run: cd dist && zip -q -r ../Kate-CC0-Model-Library.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kate-CC0-Model-Library
          path: Kate-CC0-Model-Library.zip
          retention-days: 30
